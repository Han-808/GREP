<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Examples · GREP</title>
  <link rel="stylesheet" href="./assets/public-board-shared.css">
  <link rel="stylesheet" href="./assets/examples.css">
</head><body class="examples-page">
<script src="./assets/public-board-policy.js"></script>
<header class="topbar"><a class="brand" href="./">GREP</a><nav class="site-navigation" aria-label="Main navigation"></nav></header>
<section class="page-intro"><h1>Examples</h1><p>Scene generation models evaluated by GREP.</p><a class="report-sample-link" href="./#report-example">Read a real diagnostic record · Paper Table 9 ↗</a></section>
  <section class="board-hierarchy" aria-label="Example benchmarks"><nav id="board-kind" aria-label="Benchmark type"></nav><nav id="floorplan-level" class="floorplan-level" aria-label="Model benchmarks"></nav><p id="hierarchy-context" class="hierarchy-context"></p></section>
<div class="board-page">
  <div class="collection-meta"><span id="updated">Loading examples…</span></div>
  <div class="compact-selectors" aria-label="Choose an example">
    <label>Model<select id="model-select-mobile" aria-label="Model"></select></label>
    <label>Layout<select id="scene-select-mobile" aria-label="Layout"></select></label>
    <label class="room-selector-label">View<select id="room-select-mobile" aria-label="Room or whole layout"></select></label>
  </div>
  <div class="example-workspace">
    <aside class="example-sidebar" aria-label="Browse examples">
      <label class="sidebar-label" for="model-select">Model</label><select id="model-select" aria-label="Model"></select>
      <div class="sidebar-section"><h2>Layouts</h2><span id="summary"></span></div>
      <div class="layout-list" id="layout-list" aria-label="Layouts"></div>
    </aside>
    <main class="main" id="main"><div class="empty">Loading the selected example…</div></main>
  </div>
</div>
<script src="./assets/public-board-navigation.js"></script>
<script src="./assets/object-labels.js"></script>
<script>
    const selection = new URLSearchParams(location.search);
    let data=null, selectedDataset=selection.get('dataset')||selection.get('model'), selectedLayout=selection.get('layout')||selection.get('scene'), selectedRoom=selection.get('room');
    const $=id=>document.getElementById(id);
    const language="en";
    const zh={
      "Generation + evaluation":"生成与评测","Loading scenes…":"正在加载场景…","layouts":"布局","scored":"已评分","average":"均分","rooms":"房间","objects":"对象","Evaluated":"已评测","Generation complete":"生成完成","Layout global view":"布局全局视图","assembled multi-room scene":"多房间组合场景","Room-level global views":"房间级全局视图","Select a room to inspect its evaluation.":"点击房间查看单房评测。","Layout score":"布局得分","Room score":"房间得分","overall score":"总分","Physical Validity":"物理有效性","Human-Use":"人类使用","Visual Coherence":"视觉一致性","Metric scores":"指标得分","Collision":"碰撞","Out-of-bounds":"越界","Collision + Out of bounds":"碰撞 + 越界","Support":"支撑","Function":"功能","Placement":"摆放","Style":"风格","Scale":"尺度","Pairing":"搭配","Collision + Support + Out-of-bounds":"碰撞 + 支撑 + 越界","Function + Placement":"功能 + 摆放","Scale + Style + Pairing":"尺度 + 风格 + 搭配","Original findings":"原始判定记录","No attributed deductions.":"没有可归因的扣分。","Evaluation not available for this generation.":"该生成结果尚无评测。","Input net-area weighted room aggregate. Global architecture and cross-room interactions are not scored.":"按固定输入房间净面积加权汇总；不评估全局架构与跨房间交互。","Score uses the independent room evaluation; image shows the generation room with physical walls.":"分数来自独立房间评测；图片展示带物理墙体的 generation 房间。","Back to layout":"返回布局","Room":"房间","Layout":"布局","Coverage":"覆盖率","Weight":"权重","Generation-only model":"仅生成模型","evaluated models":"个已评测模型","scored layouts":"个已评分布局","scored rooms":"个已评分房间","Multi-room index failed to load":"多房间索引加载失败"
    };
    const t=value=>language==="zh"?(zh[value]||value):value;
    const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);
    const fmt=value=>value==null?"—":Number(value).toFixed(1);
    const labelize=value=>String(value||"").replaceAll("_"," ").replace(/\b\w/g,char=>char.toUpperCase());
    const tone=value=>value==null?"#aeb7bc":value>=80?"#267b72":value>=65?"#8a7755":"#a3655e";
    const dataset=()=>data.datasets.find(item=>item.key===selectedDataset)||data.datasets[0];
    const layout=()=>dataset().layouts.find(item=>item.scene_id===selectedLayout||item.layout_id===selectedLayout)||dataset().layouts[0];
    const isEvaluated=row=>row?.status==="evaluated";
    const stateLabel=row=>isEvaluated(row)?t("Evaluated"):t("Generation complete");
    const stateClass=row=>isEvaluated(row)?"evaluated":"generation";
    const missingAstra=()=>selectedDataset==='gpt6_astra_high'&&!data.datasets.some(item=>item.key===selectedDataset);

    const metricGroups=[
      {label:"Physical Validity",note:"Collision + Support + Out-of-bounds",category:"physical",metrics:[["collision","Collision"],["support","Support"],["oob","Out-of-bounds"]]},
      {label:"Visual Coherence",note:"Scale + Style + Pairing",category:"visual_coherence",metrics:[["scale_consistency","Scale"],["style_consistency","Style"],["object_pairing_consistency","Pairing"]]},
      {label:"Human-Use",note:"Function + Placement",category:"functional_semantics",metrics:[["functional_consistency","Function"],["semantic_placement_consistency","Placement"]]}
    ];

    function renderTabs(){
      if(!missingAstra())selectedDataset=dataset().key;
      const options=(!data.datasets.some(item=>item.key==='gpt6_astra_high')?'<option value="gpt6_astra_high">GPT-6 Astra · Coming soon</option>':'')+data.datasets.map(item=>`<option value="${esc(item.key)}">${esc(window.grepModelLabel(item))}</option>`).join('');
      ['model-select','model-select-mobile'].forEach(id=>{
        $(id).innerHTML=options;$(id).value=selectedDataset;
        $(id).onchange=()=>{selectedDataset=$(id).value;selectedLayout=null;selectedRoom=null;render()};
      });
    }

    function renderSidebar(){
      const current=dataset();
      selectedLayout=layout()?.scene_id||null;
      $("summary").textContent=current.layouts.length;
      $("layout-list").innerHTML=current.layouts.map(row=>`<button class="layout-card ${row.scene_id===selectedLayout?"active":""}" aria-pressed="${row.scene_id===selectedLayout}" data-layout="${esc(row.scene_id)}"><span class="layout-thumb"><img src="${esc(row.scene_image_url)}" alt="" loading="lazy"></span><span class="layout-copy"><strong>${esc(labelize(row.layout_id))}<i class="score-chip">${fmt(row.scoring_eligible===false?null:row.score)}</i></strong><small>${row.room_count} ${t("rooms")} · ${row.object_count} ${t("objects")}</small></span></button>`).join("");
      $("layout-list").querySelectorAll("button").forEach(button=>button.onclick=()=>{selectedLayout=button.dataset.layout;selectedRoom=null;renderSidebar();renderDetail()});
      $('scene-select-mobile').innerHTML=current.layouts.map(row=>`<option value="${esc(row.scene_id)}">${esc(labelize(row.layout_id))} · ${row.room_count} rooms</option>`).join('');
      $('scene-select-mobile').value=selectedLayout;
      $('scene-select-mobile').onchange=()=>{selectedLayout=$('scene-select-mobile').value;selectedRoom=null;renderSidebar();renderDetail()};
    }

    function metricPanel(row){
      const metrics=row.metrics||{};
      return `<div class="metric-categories">${metricGroups.map(group=>`<section class="metric-category"><div class="metric-category-head"><strong>${t(group.label)}</strong><b style="color:${tone(row[group.category])}">${fmt(row[group.category])}</b></div><div class="metric-category-body">${group.metrics.map(([id,label])=>`<div class="metric"><span class="metric-name">${t(label)}</span><div class="track"><div class="fill" style="width:${metrics[id]==null?0:Math.max(0,Math.min(100,metrics[id]))}%;background:${tone(metrics[id])}"></div></div><span class="metric-score">${fmt(metrics[id])}</span></div>`).join("")}</div></section>`).join("")}</div>`;
    }

    function coverageFact(row){return "";}

    function scorePanel(row,scope){
      if(scope==='layout'&&row.scoring_eligible===false){
        const rooms=Array.isArray(row.rooms)?row.rooms:[];
        const scored=rooms.filter(room=>Number.isFinite(room.score)).length;
        return `<section class="score-panel" aria-label="Layout evaluation"><div class="score-top"><div class="score-copy"><p class="eyebrow">GREP evaluation</p><h3>Layout score</h3></div><div class="overall-score"><strong>—</strong></div></div><p class="score-note">Not ranked · ${scored}/${rooms.length} rooms scored</p></section>`;
      }
      return `<section class="score-panel" aria-label="${scope==='layout'?'Layout':'Room'} evaluation"><div class="score-top"><div class="score-copy"><p class="eyebrow">GREP evaluation</p><h3>${scope==='layout'?'Layout':'Room'} score</h3></div><div class="overall-score"><strong>${fmt(row.score)}</strong><span>/ 100</span></div></div>${metricPanel(row)}${scope==='room'?deductionPanel(row):''}${row.score==null?`<p class="provenance">${t("Evaluation not available for this generation.")}</p>`:''}</section>`;
    }

    function deductionPanel(room){
      const rows=Array.isArray(room.deductions)?room.deductions:[];
      const metrics=room.metrics||{};
      const activeRows=rows.filter(row=>Number.isFinite(metrics[row.metric])&&metrics[row.metric]<100-1e-6);
      const objects=[...new Set(activeRows.flatMap(row=>Array.isArray(row.object_ids)?row.object_ids:[]))].sort();
      const content=objects.length?`<ul class="deduction-objects">${objects.map(id=>`<li><span title="${esc(id)}">${esc(window.grepObjectLabel(id))}</span></li>`).join('')}</ul>`:`<p class="deduction-empty">${room.score===100?'No deducted objects.':'Details coming soon'}</p>`;
      return `<details class="deduction-menu"><summary><span>Deducted objects</span></summary><div class="deduction-menu-body">${content}</div></details>`;
    }

    function renderLayoutDetail(current,row){
      const index=current.layouts.indexOf(row)+1;
      const rooms=row.rooms.map(room=>`<button class="room-tile" data-room="${esc(room.room_key)}"><img src="${esc(room.image_url)}" alt="${esc(labelize(room.scene_type))} from ${esc(window.grepModelLabel(current))} ${esc(row.layout_id)}" loading="lazy"><span class="room-tile-copy"><strong>${esc(labelize(room.scene_type))}<i class="score-chip">${fmt(room.score)}</i></strong><small>${esc(room.room_id)} · ${room.object_count} objects</small></span></button>`).join('');
      $("main").innerHTML=`<div class="hero-head"><div><p class="scene-kicker">${esc(window.grepModelLabel(current))} <span> / </span> ${esc(row.layout_id)}</p><h2>${esc(labelize(row.aggregate_shape||row.layout_id))}</h2><div class="hero-sub">${row.room_count} rooms · ${row.object_count} objects</div></div><span class="case-position">${index} / ${current.layouts.length}</span></div><div class="content-layout"><div class="visual-column"><section class="scene-figure"><div class="viewer"><img src="${esc(row.scene_image_url)}" alt="${esc(window.grepModelLabel(current))} ${esc(row.layout_id)} layout global view"></div><div class="viewer-foot"><span>Layout view</span><a href="${esc(row.scene_image_url)}" target="_blank" rel="noopener">Open full image ↗</a></div></section><div class="room-section-head"><h3>Inside this layout</h3><p>Select a room to inspect its evaluation.</p></div><div class="room-grid">${rooms}</div></div>${scorePanel(row,'layout')}</div>`;
      $("main").querySelectorAll('.room-tile').forEach(button=>button.onclick=()=>{selectedRoom=button.dataset.room;renderDetail();$('main').scrollIntoView({block:'start',behavior:'smooth'})});
    }

    function renderRoomDetail(current,row,room){
      $("main").innerHTML=`<button class="back-button" id="back-layout">← Back to layout</button><div class="hero-head"><div><p class="scene-kicker">${esc(window.grepModelLabel(current))} <span> / </span> ${esc(row.layout_id)} <span> / </span> ${esc(room.room_id)}</p><h2>${esc(labelize(room.scene_type))}</h2><div class="hero-sub">${room.object_count} objects · Room ${room.order_index+1} of ${row.room_count}</div></div></div><div class="content-layout"><div class="visual-column"><section class="scene-figure"><div class="viewer"><img src="${esc(room.image_url)}" alt="${esc(window.grepModelLabel(current))} ${esc(row.layout_id)} ${esc(room.room_id)}"></div><div class="viewer-foot"><span>Room view</span><a href="${esc(room.image_url)}" target="_blank" rel="noopener">Open full image ↗</a></div></section></div>${scorePanel(room,'room')}</div>`;
      $("back-layout").onclick=()=>{selectedRoom=null;renderDetail()};
    }

    function renderDetail(){
      const current=dataset(),row=layout();if(!row)return;
      const room=selectedRoom?row.rooms.find(item=>item.room_key===selectedRoom||item.room_id===selectedRoom):null;
      selectedRoom=room?.room_key||null;
      if(room)renderRoomDetail(current,row,room);else renderLayoutDetail(current,row);
      $('room-select-mobile').innerHTML='<option value="">Whole layout</option>'+row.rooms.map(item=>`<option value="${esc(item.room_key)}">${esc(labelize(item.scene_type))} · ${esc(item.room_id)}</option>`).join('');
      $('room-select-mobile').value=selectedRoom||'';
      $('room-select-mobile').onchange=()=>{selectedRoom=$('room-select-mobile').value||null;renderDetail()};
      const url=new URL(location.href);
      url.searchParams.set('scope','multi-room');url.searchParams.set('dataset',current.key);url.searchParams.set('layout',row.layout_id);
      if(room)url.searchParams.set('room',room.room_key);else url.searchParams.delete('room');
      ['model','scene','case','condition','group'].forEach(key=>url.searchParams.delete(key));history.replaceState(null,'',url);
      window.updateBoardHierarchy?.('multi-room', current.key);
    }
    function renderMissingAstra(){
      $("summary").textContent='—';$("layout-list").innerHTML='';
      ['scene-select-mobile','room-select-mobile'].forEach(id=>{$(id).innerHTML='<option value="">—</option>';$(id).disabled=true});
      $("main").innerHTML='<div class="empty"><p class="scene-kicker">GPT-6 Astra</p><h2>Coming soon</h2><a class="back-button" href="./scene_liveboard.html?scope=open-space&dataset=gpt6_astra_high">View open-space examples →</a></div>';
      const url=new URL(location.href);url.searchParams.set('scope','multi-room');url.searchParams.set('dataset',selectedDataset);
      ['model','scene','case','layout','room','condition','group'].forEach(key=>url.searchParams.delete(key));history.replaceState(null,'',url);
      window.updateBoardHierarchy?.('multi-room',selectedDataset);
    }
    function render(){if(!data)return;renderTabs();if(missingAstra())renderMissingAstra();else{['scene-select-mobile','room-select-mobile'].forEach(id=>$(id).disabled=false);renderSidebar();renderDetail()}$("updated").textContent=`${data.datasets.length} models · ${data.counts.layouts} layouts · ${data.reporting_counts?.scored_rooms??data.counts.scored_rooms} scored rooms`}
    async function load(){try{const response=await fetch("./multi_room_sceneboard.json",{cache:"no-store"});if(!response.ok)throw new Error(`status ${response.status}`);data=await response.json();data.datasets.forEach(item=>{if(!Array.isArray(item.layouts))item.layouts=Array.isArray(item.scenes)?item.scenes:[]});selectedDataset||=data.datasets[0]?.key||null;render()}catch(error){$("main").innerHTML=`<div class="error">${t("Multi-room index failed to load")}: ${esc(error.message)}</div>`}}
    addEventListener("keydown",event=>{if(!data||missingAstra()||selectedRoom||!["ArrowLeft","ArrowRight"].includes(event.key)||/^(SELECT|INPUT|TEXTAREA|BUTTON|SUMMARY)$/.test(event.target.tagName)||event.target.isContentEditable)return;const layouts=dataset().layouts;let index=layouts.findIndex(item=>item.scene_id===selectedLayout);index=(index+(event.key==="ArrowRight"?1:-1)+layouts.length)%layouts.length;selectedLayout=layouts[index]?.scene_id||null;render()});
    load();
  </script>
</body></html>
