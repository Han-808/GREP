<script id="scene-views" type="application/json">{"multi-room": "\u003c!doctype html>\n\u003chtml lang=\"en\">\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  \u003ctitle>Examples · GREP\u003c/title>\n  \u003clink rel=\"stylesheet\" href=\"./assets/public-board-shared.css\">\n  \u003clink rel=\"stylesheet\" href=\"./assets/examples.css\">\n\u003c/head>\u003cbody class=\"examples-page\">\n\u003cscript src=\"./assets/public-board-policy.js\">\u003c/script>\n\u003cheader class=\"topbar\">\u003ca class=\"brand\" href=\"./\">GREP\u003c/a>\u003cnav class=\"site-navigation\" aria-label=\"Main navigation\">\u003c/nav>\u003c/header>\n\u003csection class=\"page-intro\">\u003cp class=\"eyebrow\">GREP / Examples\u003c/p>\u003ch1>From scenes to evidence.\u003c/h1>\u003cp>Explore assembled layouts, then inspect the individual rooms and their evaluations.\u003c/p>\u003c/section>\n  \u003csection class=\"board-hierarchy\" aria-label=\"Example benchmarks\">\u003cnav id=\"board-kind\" aria-label=\"Benchmark type\">\u003c/nav>\u003cnav id=\"floorplan-level\" class=\"floorplan-level\" aria-label=\"Model benchmarks\">\u003c/nav>\u003cp id=\"hierarchy-context\" class=\"hierarchy-context\">\u003c/p>\u003c/section>\n\u003cdiv class=\"board-page\">\n  \u003cdiv class=\"collection-meta\">\u003cspan>Multi-room · layout and room views\u003c/span>\u003cspan id=\"updated\">Loading examples…\u003c/span>\u003c/div>\n  \u003cdiv class=\"compact-selectors\" aria-label=\"Choose an example\">\n    \u003clabel>Model\u003cselect id=\"model-select-mobile\" aria-label=\"Model\">\u003c/select>\u003c/label>\n    \u003clabel>Layout\u003cselect id=\"scene-select-mobile\" aria-label=\"Layout\">\u003c/select>\u003c/label>\n    \u003clabel class=\"room-selector-label\">View\u003cselect id=\"room-select-mobile\" aria-label=\"Room or whole layout\">\u003c/select>\u003c/label>\n  \u003c/div>\n  \u003cdiv class=\"example-workspace\">\n    \u003caside class=\"example-sidebar\" aria-label=\"Browse examples\">\n      \u003clabel class=\"sidebar-label\" for=\"model-select\">Model\u003c/label>\u003cselect id=\"model-select\" aria-label=\"Model\">\u003c/select>\n      \u003cdiv class=\"sidebar-section\">\u003ch2>Layouts\u003c/h2>\u003cspan id=\"summary\">\u003c/span>\u003c/div>\n      \u003cdiv class=\"layout-list\" id=\"layout-list\" aria-label=\"Layouts\">\u003c/div>\n    \u003c/aside>\n    \u003cmain class=\"main\" id=\"main\">\u003cdiv class=\"empty\">Loading the selected example…\u003c/div>\u003c/main>\n  \u003c/div>\n\u003c/div>\n\u003cscript>\n    const selection = new URLSearchParams(location.search);\n    let data=null, selectedDataset=selection.get('dataset')||selection.get('model'), selectedLayout=selection.get('layout')||selection.get('scene'), selectedRoom=selection.get('room');\n    const $=id=>document.getElementById(id);\n    const language=\"en\";\n    const zh={\n      \"Generation + evaluation\":\"生成与评测\",\"Loading scenes…\":\"正在加载场景…\",\"layouts\":\"布局\",\"scored\":\"已评分\",\"average\":\"均分\",\"rooms\":\"房间\",\"objects\":\"对象\",\"Evaluated\":\"已评测\",\"Generation complete\":\"生成完成\",\"Layout global view\":\"布局全局视图\",\"assembled multi-room scene\":\"多房间组合场景\",\"Room-level global views\":\"房间级全局视图\",\"Select a room to inspect its evaluation.\":\"点击房间查看单房评测。\",\"Layout score\":\"布局得分\",\"Room score\":\"房间得分\",\"overall score\":\"总分\",\"Physical Plausibility\":\"物理合理性\",\"Functional Semantics\":\"功能与语义布局\",\"Visual Coherence\":\"视觉一致性\",\"Metric scores\":\"指标得分\",\"Collision\":\"碰撞\",\"Out of bounds\":\"越界\",\"Collision + Out of bounds\":\"碰撞 + 越界\",\"Support\":\"支撑\",\"Functional Consistency\":\"功能一致性\",\"Semantic Placement Consistency\":\"语义摆放一致性\",\"Style Consistency\":\"风格一致性\",\"Scale Consistency\":\"尺度一致性\",\"Object Pairing Consistency\":\"对象搭配一致性\",\"Physical metrics\":\"物理指标\",\"Function + Placement\":\"功能 + 摆放\",\"Style + Scale + Pairing\":\"风格 + 尺度 + 搭配\",\"Original findings\":\"原始判定记录\",\"No attributed deductions.\":\"没有可归因的扣分。\",\"Evaluation not available for this generation.\":\"该生成结果尚无评测。\",\"Input net-area weighted room aggregate. Global architecture and cross-room interactions are not scored.\":\"按固定输入房间净面积加权汇总；不评估全局架构与跨房间交互。\",\"Score uses the independent room evaluation; image shows the generation room with physical walls.\":\"分数来自独立房间评测；图片展示带物理墙体的 generation 房间。\",\"Back to layout\":\"返回布局\",\"Room\":\"房间\",\"Layout\":\"布局\",\"Coverage\":\"覆盖率\",\"Weight\":\"权重\",\"Generation-only model\":\"仅生成模型\",\"evaluated models\":\"个已评测模型\",\"scored layouts\":\"个已评分布局\",\"scored rooms\":\"个已评分房间\",\"Multi-room index failed to load\":\"多房间索引加载失败\"\n    };\n    const t=value=>language===\"zh\"?(zh[value]||value):value;\n    const esc=value=>String(value??\"\").replace(/[&\u003c>\"']/g,char=>({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"})[char]);\n    const fmt=value=>value==null?\"—\":Number(value).toFixed(2);\n    const labelize=value=>String(value||\"\").replaceAll(\"_\",\" \").replace(/\\b\\w/g,char=>char.toUpperCase());\n    const tone=value=>value==null?\"#aeb7bc\":value>=80?\"#267b72\":value>=65?\"#8a7755\":\"#a3655e\";\n    const dataset=()=>data.datasets.find(item=>item.key===selectedDataset)||data.datasets[0];\n    const layout=()=>dataset().layouts.find(item=>item.scene_id===selectedLayout||item.layout_id===selectedLayout)||dataset().layouts[0];\n    const isEvaluated=row=>row?.status===\"evaluated\";\n    const stateLabel=row=>isEvaluated(row)?t(\"Evaluated\"):t(\"Generation complete\");\n    const stateClass=row=>isEvaluated(row)?\"evaluated\":\"generation\";\n\n    const metricGroups=[\n      {label:\"Physical Plausibility\",note:\"Physical metrics\",category:\"physical\",metrics:[[\"collision\",\"Collision\"],[\"oob\",\"Out of bounds\"],[\"support\",\"Support\"]]},\n      {label:\"Functional Semantics\",note:\"Function + Placement\",category:\"functional_semantics\",metrics:[[\"functional_consistency\",\"Functional Consistency\"],[\"semantic_placement_consistency\",\"Semantic Placement Consistency\"]]},\n      {label:\"Visual Coherence\",note:\"Style + Scale + Pairing\",category:\"visual_coherence\",metrics:[[\"style_consistency\",\"Style Consistency\"],[\"scale_consistency\",\"Scale Consistency\"],[\"object_pairing_consistency\",\"Object Pairing Consistency\"]]}\n    ];\n\n    function renderTabs(){\n      selectedDataset=dataset().key;\n      const options=data.datasets.map(item=>`\u003coption value=\"${esc(item.key)}\">${esc(item.label)}\u003c/option>`).join('');\n      ['model-select','model-select-mobile'].forEach(id=>{\n        $(id).innerHTML=options;$(id).value=selectedDataset;\n        $(id).onchange=()=>{selectedDataset=$(id).value;selectedLayout=null;selectedRoom=null;render()};\n      });\n    }\n\n    function renderSidebar(){\n      const current=dataset();\n      selectedLayout=layout()?.scene_id||null;\n      $(\"summary\").textContent=current.layouts.length;\n      $(\"layout-list\").innerHTML=current.layouts.map(row=>`\u003cbutton class=\"layout-card ${row.scene_id===selectedLayout?\"active\":\"\"}\" aria-pressed=\"${row.scene_id===selectedLayout}\" data-layout=\"${esc(row.scene_id)}\">\u003cspan class=\"layout-thumb\">\u003cimg src=\"${esc(row.scene_image_url)}\" alt=\"\" loading=\"lazy\">\u003c/span>\u003cspan class=\"layout-copy\">\u003cstrong>${esc(labelize(row.layout_id))}\u003ci class=\"score-chip\">${fmt(row.score)}\u003c/i>\u003c/strong>\u003csmall>${row.room_count} ${t(\"rooms\")} · ${row.object_count} ${t(\"objects\")}\u003c/small>\u003c/span>\u003c/button>`).join(\"\");\n      $(\"layout-list\").querySelectorAll(\"button\").forEach(button=>button.onclick=()=>{selectedLayout=button.dataset.layout;selectedRoom=null;renderSidebar();renderDetail()});\n      $('scene-select-mobile').innerHTML=current.layouts.map(row=>`\u003coption value=\"${esc(row.scene_id)}\">${esc(labelize(row.layout_id))} · ${row.room_count} rooms\u003c/option>`).join('');\n      $('scene-select-mobile').value=selectedLayout;\n      $('scene-select-mobile').onchange=()=>{selectedLayout=$('scene-select-mobile').value;selectedRoom=null;renderSidebar();renderDetail()};\n    }\n\n    function metricPanel(row){\n      const metrics=row.metrics||{};\n      return `\u003cdiv class=\"metric-categories\">${metricGroups.map(group=>`\u003csection class=\"metric-category\">\u003cdiv class=\"metric-category-head\">\u003cstrong>${t(group.label)}\u003c/strong>\u003csmall>${t(group.note)}\u003c/small>\u003cb style=\"color:${tone(row[group.category])}\">${fmt(row[group.category])}\u003c/b>\u003c/div>\u003cdiv class=\"metric-category-body\">${group.metrics.map(([id,label])=>`\u003cdiv class=\"metric\">\u003cspan class=\"metric-name\">${t(label)}\u003c/span>\u003cdiv class=\"track\">\u003cdiv class=\"fill\" style=\"width:${metrics[id]==null?0:Math.max(0,Math.min(100,metrics[id]))}%;background:${tone(metrics[id])}\">\u003c/div>\u003c/div>\u003cspan class=\"metric-score\">${fmt(metrics[id])}\u003c/span>\u003c/div>`).join(\"\")}\u003c/div>\u003c/section>`).join(\"\")}\u003c/div>`;\n    }\n\n    function coverageFact(row){return \"\";}\n\n    function scorePanel(row,scope){\n      return `\u003csection class=\"score-panel\" aria-label=\"${scope==='layout'?'Layout':'Room'} evaluation\">\u003cdiv class=\"score-top\">\u003cdiv class=\"score-copy\">\u003cp class=\"eyebrow\">Evaluation\u003c/p>\u003ch3>${scope==='layout'?'Layout':'Room'} score\u003c/h3>\u003c/div>\u003cdiv class=\"overall-score\">\u003cstrong>${fmt(row.score)}\u003c/strong>\u003cspan>/ 100\u003c/span>\u003c/div>\u003c/div>${metricPanel(row)}${scope==='room'?deductionPanel(row):''}${row.score==null?`\u003cp class=\"provenance\">${t(\"Evaluation not available for this generation.\")}\u003c/p>`:''}\u003c/section>`;\n    }\n\n    function deductionPanel(room){\n      const rows=Array.isArray(room.deductions)?room.deductions:[];\n      const metrics=room.metrics||{};\n      const activeRows=rows.filter(row=>Number.isFinite(metrics[row.metric])&&metrics[row.metric]\u003c100-1e-6);\n      const objects=[...new Set(activeRows.flatMap(row=>Array.isArray(row.object_ids)?row.object_ids:[]))].sort();\n      const content=objects.length?`\u003cul class=\"deduction-objects\">${objects.map(id=>`\u003cli>\u003ccode>${esc(id)}\u003c/code>\u003c/li>`).join('')}\u003c/ul>`:`\u003cp class=\"deduction-empty\">${room.score===100?'No deducted objects.':'Object details unavailable.'}\u003c/p>`;\n      return `\u003cdetails class=\"deduction-menu\">\u003csummary>\u003cspan>Deducted objects\u003c/span>\u003c/summary>\u003cdiv class=\"deduction-menu-body\">${content}\u003c/div>\u003c/details>`;\n    }\n\n    function renderLayoutDetail(current,row){\n      const index=current.layouts.indexOf(row)+1;\n      const rooms=row.rooms.map(room=>`\u003cbutton class=\"room-tile\" data-room=\"${esc(room.room_key)}\">\u003cimg src=\"${esc(room.image_url)}\" alt=\"${esc(labelize(room.scene_type))} from ${esc(current.label)} ${esc(row.layout_id)}\" loading=\"lazy\">\u003cspan class=\"room-tile-copy\">\u003cstrong>${esc(labelize(room.scene_type))}\u003ci class=\"score-chip\">${fmt(room.score)}\u003c/i>\u003c/strong>\u003csmall>${esc(room.room_id)} · ${room.object_count} objects\u003c/small>\u003c/span>\u003c/button>`).join('');\n      $(\"main\").innerHTML=`\u003cdiv class=\"hero-head\">\u003cdiv>\u003cp class=\"scene-kicker\">${esc(current.label)} \u003cspan> / \u003c/span> ${esc(row.layout_id)}\u003c/p>\u003ch2>${esc(labelize(row.aggregate_shape||row.layout_id))}\u003c/h2>\u003cdiv class=\"hero-sub\">${row.room_count} rooms · ${row.object_count} objects · Assembled layout\u003c/div>\u003c/div>\u003cspan class=\"case-position\">${index} / ${current.layouts.length}\u003c/span>\u003c/div>\u003cdiv class=\"content-layout\">\u003cdiv class=\"visual-column\">\u003csection class=\"scene-figure\">\u003cdiv class=\"viewer\">\u003cimg src=\"${esc(row.scene_image_url)}\" alt=\"${esc(current.label)} ${esc(row.layout_id)} layout global view\">\u003c/div>\u003cdiv class=\"viewer-foot\">\u003cspan>Layout global view · standardized perspective\u003c/span>\u003ca href=\"${esc(row.scene_image_url)}\" target=\"_blank\" rel=\"noopener\">Open full image ↗\u003c/a>\u003c/div>\u003c/section>\u003cdiv class=\"room-section-head\">\u003ch3>Inside this layout\u003c/h3>\u003cp>Select a room to inspect its evaluation.\u003c/p>\u003c/div>\u003cdiv class=\"room-grid\">${rooms}\u003c/div>\u003c/div>${scorePanel(row,'layout')}\u003c/div>`;\n      $(\"main\").querySelectorAll('.room-tile').forEach(button=>button.onclick=()=>{selectedRoom=button.dataset.room;renderDetail();$('main').scrollIntoView({block:'start',behavior:'smooth'})});\n    }\n\n    function renderRoomDetail(current,row,room){\n      $(\"main\").innerHTML=`\u003cbutton class=\"back-button\" id=\"back-layout\">← Back to layout\u003c/button>\u003cdiv class=\"hero-head\">\u003cdiv>\u003cp class=\"scene-kicker\">${esc(current.label)} \u003cspan> / \u003c/span> ${esc(row.layout_id)} \u003cspan> / \u003c/span> ${esc(room.room_id)}\u003c/p>\u003ch2>${esc(labelize(room.scene_type))}\u003c/h2>\u003cdiv class=\"hero-sub\">${room.object_count} objects · Room ${room.order_index+1} of ${row.room_count}\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"content-layout\">\u003cdiv class=\"visual-column\">\u003csection class=\"scene-figure\">\u003cdiv class=\"viewer\">\u003cimg src=\"${esc(room.image_url)}\" alt=\"${esc(current.label)} ${esc(row.layout_id)} ${esc(room.room_id)}\">\u003c/div>\u003cdiv class=\"viewer-foot\">\u003cspan>Room view · standardized perspective\u003c/span>\u003ca href=\"${esc(room.image_url)}\" target=\"_blank\" rel=\"noopener\">Open full image ↗\u003c/a>\u003c/div>\u003c/section>\u003c/div>${scorePanel(room,'room')}\u003c/div>`;\n      $(\"back-layout\").onclick=()=>{selectedRoom=null;renderDetail()};\n    }\n\n    function renderDetail(){\n      const current=dataset(),row=layout();if(!row)return;\n      const room=selectedRoom?row.rooms.find(item=>item.room_key===selectedRoom||item.room_id===selectedRoom):null;\n      selectedRoom=room?.room_key||null;\n      if(room)renderRoomDetail(current,row,room);else renderLayoutDetail(current,row);\n      $('room-select-mobile').innerHTML='\u003coption value=\"\">Whole layout\u003c/option>'+row.rooms.map(item=>`\u003coption value=\"${esc(item.room_key)}\">${esc(labelize(item.scene_type))} · ${esc(item.room_id)}\u003c/option>`).join('');\n      $('room-select-mobile').value=selectedRoom||'';\n      $('room-select-mobile').onchange=()=>{selectedRoom=$('room-select-mobile').value||null;renderDetail()};\n      const url=new URL(location.href);\n      url.searchParams.set('scope','multi-room');url.searchParams.set('dataset',current.key);url.searchParams.set('layout',row.layout_id);\n      if(room)url.searchParams.set('room',room.room_key);else url.searchParams.delete('room');\n      ['model','scene','case','condition','group'].forEach(key=>url.searchParams.delete(key));history.replaceState(null,'',url);\n    }\n    function render(){if(!data)return;renderTabs();renderSidebar();renderDetail();$(\"updated\").textContent=`${data.datasets.length} models · ${data.counts.layouts} layouts · ${data.reporting_counts?.scored_rooms??data.counts.scored_rooms} scored rooms`}\n    async function load(){try{const response=await fetch(\"./multi_room_sceneboard.json\",{cache:\"no-store\"});if(!response.ok)throw new Error(`status ${response.status}`);data=await response.json();data.datasets.forEach(item=>{if(!Array.isArray(item.layouts))item.layouts=Array.isArray(item.scenes)?item.scenes:[]});selectedDataset||=data.datasets[0]?.key||null;render()}catch(error){$(\"main\").innerHTML=`\u003cdiv class=\"error\">${t(\"Multi-room index failed to load\")}: ${esc(error.message)}\u003c/div>`}}\n    addEventListener(\"keydown\",event=>{if(!data||selectedRoom||![\"ArrowLeft\",\"ArrowRight\"].includes(event.key)||/^(SELECT|INPUT|TEXTAREA|BUTTON|SUMMARY)$/.test(event.target.tagName)||event.target.isContentEditable)return;const layouts=dataset().layouts;let index=layouts.findIndex(item=>item.scene_id===selectedLayout);index=(index+(event.key===\"ArrowRight\"?1:-1)+layouts.length)%layouts.length;selectedLayout=layouts[index]?.scene_id||null;render()});\n    load();\n  \u003c/script>\n\u003cscript src=\"./assets/public-board-navigation.js\">\u003c/script>\n\u003c/body>\u003c/html>\n", "open-space": "\u003c!doctype html>\n\u003chtml lang=\"en\">\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  \u003ctitle>Examples · GREP\u003c/title>\n  \u003clink rel=\"stylesheet\" href=\"./assets/public-board-shared.css\">\n  \u003clink rel=\"stylesheet\" href=\"./assets/examples.css\">\n\u003c/head>\u003cbody class=\"examples-page\">\n\u003cscript src=\"./assets/public-board-policy.js\">\u003c/script>\n\u003cheader class=\"topbar\">\u003ca class=\"brand\" href=\"./\">GREP\u003c/a>\u003cnav class=\"site-navigation\" aria-label=\"Main navigation\">\u003c/nav>\u003c/header>\n\u003csection class=\"page-intro\">\u003cp class=\"eyebrow\">GREP / Examples\u003c/p>\u003ch1>From scenes to evidence.\u003c/h1>\u003cp>Explore generated scenes in a rectangular, wall-free setting, alongside their grounded evaluations.\u003c/p>\u003c/section>\n  \u003csection class=\"board-hierarchy\" aria-label=\"Example benchmarks\">\u003cnav id=\"board-kind\" aria-label=\"Benchmark type\">\u003c/nav>\u003cnav id=\"floorplan-level\" class=\"floorplan-level\" aria-label=\"Model benchmarks\">\u003c/nav>\u003cp id=\"hierarchy-context\" class=\"hierarchy-context\">\u003c/p>\u003c/section>\n\u003cdiv class=\"board-page\">\n  \u003cdiv class=\"collection-meta\">\u003cspan>Single-room · rectangular, wall-free\u003c/span>\u003cspan id=\"updated\">Loading examples…\u003c/span>\u003c/div>\n  \u003cdiv class=\"compact-selectors\" aria-label=\"Choose an example\">\n    \u003clabel>Model\u003cselect id=\"model-select-mobile\" aria-label=\"Model\">\u003c/select>\u003c/label>\n    \u003clabel>Scene\u003cselect id=\"scene-select-mobile\" aria-label=\"Scene\">\u003c/select>\u003c/label>\n\n  \u003c/div>\n  \u003cdiv class=\"example-workspace\">\n    \u003caside class=\"example-sidebar\" aria-label=\"Browse examples\">\n      \u003clabel class=\"sidebar-label\" for=\"model-select\">Model\u003c/label>\u003cselect id=\"model-select\" aria-label=\"Model\">\u003c/select>\n      \u003cdiv class=\"sidebar-section\">\u003ch2>Scenes\u003c/h2>\u003cspan id=\"summary\">\u003c/span>\u003c/div>\n      \u003cdiv class=\"scene-list\" id=\"scene-list\" aria-label=\"Scenes\">\u003c/div>\n    \u003c/aside>\n    \u003cmain class=\"main\" id=\"main\">\u003cdiv class=\"empty\">Loading the selected example…\u003c/div>\u003c/main>\n  \u003c/div>\n\u003c/div>\n\u003cscript>\n    const selection = new URLSearchParams(location.search);\n    let data = null;\n    let selectedDataset = selection.get('dataset') || selection.get('model') || \"anthropic_fable5\";\n    let selectedCase = selection.get('scene') || selection.get('case') || null;\n    let deductionsOpen = false;\n\n    const $ = id => document.getElementById(id);\n    function legacyDisplayLabel(item, scope) {\n      return scope === \"open-space\" && item.key === \"hy3_aw\" && !/\\blegacy\\b/i.test(item.label)\n        ? `${item.label} · legacy` : item.label;\n    }\n\n    const esc = value => String(value ?? \"\").replace(/[&\u003c>\"']/g, char => ({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"})[char]);\n    const fmt = value => value == null ? \"—\" : Number(value).toFixed(1);\n    const liveScore = scene => scene.liveboard_score ?? scene.score;\n    const liveL1 = scene => scene.liveboard_l1_score ?? scene.l1_score;\n    const liveMetrics = scene => scene.liveboard_metrics || scene.metrics || {};\n    const fmtInt = value => new Intl.NumberFormat(\"en-US\").format(Number(value || 0));\n    const fmtTokens = value => {\n      const n = Number(value || 0);\n      return n >= 1e6 ? `${(n / 1e6).toFixed(2)}M` : n >= 1e3 ? `${(n / 1e3).toFixed(0)}k` : `${n}`;\n    };\n    const actionablePartial = scene => scene.acceptance_status === \"accepted_partial_coverage\" || (scene.score_status === \"partial_coverage\" && Number(scene.coverage || 0) \u003c= 90);\n    const tag = scene => actionablePartial(scene) ? \"partial\" : scene.status === \"complete\" && scene.score != null ? \"tested\" : scene.status === \"failed\" ? \"failed\" : \"pending\";\n    const coverage = scene => scene.coverage == null ? \"—\" : `${Number(scene.coverage).toFixed(0)}%`;\n    const tone = value => value == null ? \"#aeb7bc\" : value >= 80 ? \"#267b72\" : value >= 65 ? \"#8a7755\" : \"#a3655e\";\n    const labelize = value => String(value || 'Scene').replaceAll('_', ' ');\n    const metricNames = {\n      collision: \"Collision\", oob: \"Out of bounds\", support: \"Support\",\n      scale_consistency: \"Scale Consistency\", object_pairing_consistency: \"Object Pairing Consistency\",\n      style_consistency: \"Style Consistency\", functional_consistency: \"Functional Consistency\",\n      semantic_placement_consistency: \"Semantic Placement Consistency\"\n    };\n    const scoreCategories = [\n      {id: \"physical\", label: \"Physical Plausibility\", metrics: [\"collision\", \"oob\", \"support\"], aggregate: [\"collision\", \"oob\", \"support\"]},\n      {id: \"spatial\", label: \"Functional Semantics\", metrics: [\"functional_consistency\", \"semantic_placement_consistency\"], aggregate: [\"functional_consistency\", \"semantic_placement_consistency\"]},\n      {id: \"visual\", label: \"Visual Coherence\", metrics: [\"style_consistency\", \"scale_consistency\", \"object_pairing_consistency\"], aggregate: [\"style_consistency\", \"scale_consistency\", \"object_pairing_consistency\"]}\n    ];\n    const casePrompts = {\n      S100: {brief: \"brief_00\", text: \"Generate a coherent multi-zone living, dining, and reading room. Aim for functional orientations, usable circulation, and a naturally organized scene.\"},\n      S101: {brief: \"brief_01\", text: \"Generate a coherent kitchen, dining, and utility room. Aim for sensible work areas, functional object relationships, accessible storage, and clear circulation.\"},\n      S102: {brief: \"brief_02\", text: \"Generate a coherent office, library, and meeting room. Aim for usable workstations, accessible storage, functional seating relationships, and clear circulation.\"},\n      S103: {brief: \"brief_03\", text: \"Generate a coherent bedroom, dressing, and workspace. Aim for usable furniture orientation, accessible storage, sensible support relationships, and clear circulation.\"},\n      S104: {brief: \"brief_04\", text: \"Generate a coherent media, music, game, and recreation room. Aim for functional activity zones, sensible viewing and interaction relationships, accessible equipment, and clear circulation.\"},\n      S105: {brief: \"brief_05\", text: \"Generate a coherent children's study, play, and art room. Aim for usable activity zones, sensible object relationships, accessible storage, and clear circulation.\"},\n      S106: {brief: \"brief_06\", text: \"Generate a coherent bathroom, laundry, and linen utility room. Aim for usable fixtures and appliances, accessible operating sides, sensible support and storage relationships, and clear circulation.\"},\n      S107: {brief: \"brief_07\", text: \"Generate a coherent workshop, repair, and storage room. Aim for usable workstations, accessible tools and storage, safe operating clearances, and clear circulation.\"},\n      S108: {brief: \"brief_08\", text: \"Generate a coherent café-style reading, conversation, and coworking lounge. Aim for functional seating and table relationships, accessible shared resources, and clear circulation.\"},\n      S109: {brief: \"brief_09\", text: \"Generate a coherent home fitness, yoga, recovery, and hobby room. Aim for usable activity zones, safe operating clearances, accessible equipment, and clear circulation.\"}\n    };\n    const activeText = scene => {\n      const latest = scene.latest || {};\n      return latest.call_type || [latest.phase, latest.metric, latest.group_id].filter(Boolean).join(\" · \") || latest.event || \"No activity recorded\";\n    };\n\n    function dataset() {\n      return data.datasets.find(item => item.key === selectedDataset) || data.datasets[0];\n    }\n\n    function renderTabs() {\n      selectedDataset = dataset().key;\n      const options = data.datasets.map(item => `\u003coption value=\"${esc(item.key)}\">${esc(item.label)}\u003c/option>`).join('');\n      ['model-select', 'model-select-mobile'].forEach(id => {\n        $(id).innerHTML = options;\n        $(id).value = selectedDataset;\n        $(id).onchange = () => { selectedDataset = $(id).value; selectedCase = null; deductionsOpen = false; render(); };\n      });\n    }\n\n    function renderSidebar() {\n      const current = dataset();\n      $(\"summary\").textContent = current.scenes.length;\n      if (!current.scenes.some(scene => scene.case_id === selectedCase)) {\n        selectedCase = current.scenes[0]?.case_id || null;\n      }\n      $(\"scene-list\").innerHTML = current.scenes.map(scene => {\n        const image = scene.image_url ? `\u003cimg src=\"${esc(scene.image_url)}\" alt=\"\" loading=\"lazy\">` : \"—\";\n        return `\u003cbutton class=\"scene-card ${scene.case_id === selectedCase ? \"active\" : \"\"}\" aria-pressed=\"${scene.case_id === selectedCase}\" data-case=\"${scene.case_id}\">\u003cspan class=\"scene-media\">${image}\u003c/span>\u003cspan class=\"scene-copy\">\u003cstrong>${scene.case_id}\u003ci class=\"score-chip\">${fmt(liveScore(scene))}\u003c/i>\u003c/strong>\u003csmall class=\"scene-line\">${esc(labelize(scene.scene_type))}\u003c/small>\u003c/span>\u003c/button>`;\n      }).join(\"\");\n      $(\"scene-list\").querySelectorAll(\"button\").forEach(button => button.onclick = () => {\n        selectedCase = button.dataset.case;\n        deductionsOpen = false;\n        renderSidebar();\n        renderDetail();\n      });\n      $('scene-select-mobile').innerHTML = current.scenes.map(scene => `\u003coption value=\"${esc(scene.case_id)}\">${esc(scene.case_id)} · ${esc(labelize(scene.scene_type))}\u003c/option>`).join('');\n      $('scene-select-mobile').value = selectedCase;\n      $('scene-select-mobile').onchange = () => { selectedCase = $('scene-select-mobile').value; deductionsOpen = false; renderSidebar(); renderDetail(); };\n    }\n\n    function metricRows(scene) {\n      const displayedMetrics = liveMetrics(scene);\n      const average = ids => {\n        const values = ids.map(id => displayedMetrics[id]).filter(value => value != null).map(Number);\n        return values.length === ids.length ? values.reduce((sum, value) => sum + value, 0) / values.length : null;\n      };\n      const categories = scoreCategories.map(category => {\n        const categoryScore = category.id === \"physical\" ? liveL1(scene) : category.id === \"spatial\" ? scene.liveboard_spatial_reasoning ?? average(category.aggregate) : scene.liveboard_visual_coherence ?? average(category.aggregate);\n        const items = category.metrics.map(id => {\n          const score = displayedMetrics[id];\n          const label = metricNames[id] || id;\n          return `\u003cdiv class=\"metric\">\u003cspan class=\"metric-name\">${esc(label)}\u003c/span>\u003cdiv class=\"track\">\u003cdiv class=\"fill\" style=\"width:${score == null ? 0 : Math.max(0, Math.min(100, score))}%;background:${tone(score)}\">\u003c/div>\u003c/div>\u003cspan class=\"metric-score ${score == null ? \"na\" : \"\"}\">${fmt(score)}\u003c/span>\u003c/div>`;\n        }).join(\"\");\n        const scope = category.id === \"spatial\" ? \"Functional Consistency + Semantic Placement Consistency\" : category.id === \"visual\" ? \"Style Consistency + Scale Consistency + Object Pairing Consistency\" : \"Collision + Out of Bounds + Support\";\n        return `\u003csection class=\"metric-category\">\u003cdiv class=\"metric-category-head\">\u003cstrong>${esc(category.label)}\u003c/strong>\u003csmall>${esc(scope)}\u003c/small>\u003cb style=\"color:${tone(categoryScore)}\">${fmt(categoryScore)}\u003c/b>\u003c/div>\u003cdiv class=\"metric-category-body\">${items}\u003c/div>\u003c/section>`;\n      }).join(\"\");\n      return `\u003cdiv class=\"metric-categories\">${categories}\u003c/div>`;\n    }\n\n    function deductionRows(scene) {\n      const rows = Array.isArray(scene.deductions) ? scene.deductions : [];\n      const metrics = liveMetrics(scene);\n      const activeRows = rows.filter(row => Number.isFinite(metrics[row.metric]) && metrics[row.metric] \u003c 100 - 1e-6);\n      const objects = [...new Set(activeRows.flatMap(row => Array.isArray(row.object_ids) ? row.object_ids : []))].sort();\n      const content = objects.length\n        ? `\u003cul class=\"deduction-objects\">${objects.map(id => `\u003cli>\u003ccode>${esc(id)}\u003c/code>\u003c/li>`).join(\"\")}\u003c/ul>`\n        : `\u003cp class=\"deduction-empty\">${liveScore(scene) === 100 ? 'No deducted objects.' : 'Object details unavailable.'}\u003c/p>`;\n      return `\u003cdetails class=\"deduction-menu\" ${deductionsOpen ? \"open\" : \"\"}>\u003csummary>\u003cspan>Deducted objects\u003c/span>\u003c/summary>\u003cdiv class=\"deduction-menu-body\">${content}\u003c/div>\u003c/details>`;\n    }\n\n    function renderDetail() {\n      const current = dataset();\n      const scene = current.scenes.find(item => item.case_id === selectedCase);\n      if (!scene) {\n        $(\"main\").innerHTML = `\u003cdiv class=\"empty\">\u003cdiv>\u003ch2>No scene selected\u003c/h2>\u003cp>Select a case from the scene list.\u003c/p>\u003c/div>\u003c/div>`;\n        return;\n      }\n      const index = current.scenes.indexOf(scene) + 1;\n      const prompt = casePrompts[scene.case_id];\n      const promptBlock = prompt ? `\u003cdetails class=\"scene-prompt\">\u003csummary>Generation brief\u003c/summary>\u003cp>${esc(prompt.text)}\u003c/p>\u003c/details>` : \"\";\n      const render = scene.image_url ? `\u003cimg src=\"${esc(scene.image_url)}\" alt=\"${esc(legacyDisplayLabel(current, \"open-space\"))} ${scene.case_id} global render\">` : `\u003cdiv class=\"viewer-empty\">\u003cstrong>Render unavailable\u003c/strong>\u003cbr>The source dataset image is not present on disk.\u003c/div>`;\n      const notes = [];\n      if (scene.status === \"failed\") notes.push(\"No benchmark score.\");\n      if (current.lifecycle === \"legacy\") notes.push(\"Legacy historical result · excluded from current cohort\");\n      const caveat = notes.length ? `\u003cdiv class=\"provenance\">${notes.map(esc).join(\" · \")}\u003c/div>` : \"\";\n      $(\"main\").innerHTML = `\u003cdiv class=\"hero-head\">\u003cdiv>\u003cp class=\"scene-kicker\">${esc(current.label)} \u003cspan> / \u003c/span> ${scene.case_id}\u003c/p>\u003ch2>${esc(labelize(scene.scene_type))}\u003c/h2>\u003cdiv class=\"hero-sub\">${scene.object_count == null ? \"\" : `${scene.object_count} objects · `}Single-room, wall-free\u003c/div>\u003c/div>\u003cspan class=\"case-position\">${index} / ${current.scenes.length}\u003c/span>\u003c/div>\n        \u003cdiv class=\"layout\">\u003cdiv class=\"visual-column\">\u003csection class=\"scene-figure\">\u003cdiv class=\"viewer\">${render}\u003c/div>\u003cdiv class=\"viewer-foot\">\u003cspan>Global view · standardized perspective\u003c/span>${scene.image_url ? `\u003ca href=\"${esc(scene.image_url)}\" target=\"_blank\" rel=\"noopener\">Open full image ↗\u003c/a>` : ''}\u003c/div>\u003c/section>${promptBlock}\u003c/div>\n        \u003csection class=\"score-panel\" aria-label=\"Scene evaluation\">\u003cdiv class=\"score-top\">\u003cdiv class=\"score-copy\">\u003cp class=\"eyebrow\">Evaluation\u003c/p>\u003ch3>Overall score\u003c/h3>\u003c/div>\u003cdiv class=\"overall-score\">\u003cstrong>${fmt(liveScore(scene))}\u003c/strong>\u003cspan>/ 100\u003c/span>\u003c/div>\u003c/div>\n        ${metricRows(scene)}\n        ${deductionRows(scene)}\n        ${caveat}\u003c/section>\u003c/div>`;\n      const url = new URL(location.href);\n      url.searchParams.set('scope', 'open-space'); url.searchParams.set('dataset', current.key); url.searchParams.set('scene', scene.case_id);\n      ['model', 'case', 'layout', 'room', 'condition', 'group'].forEach(key => url.searchParams.delete(key));\n      history.replaceState(null, '', url);\n      const deductionMenu = $(\"main\").querySelector(\".deduction-menu\");\n      if (deductionMenu) deductionMenu.ontoggle = () => { deductionsOpen = deductionMenu.open; };\n    }\n\n    function render() {\n      if (!data) return;\n      renderTabs();\n      renderSidebar();\n      renderDetail();\n      $(\"updated\").textContent = `${data.datasets.length} models · ${data.datasets.reduce((sum, item) => sum + item.scenes.length, 0)} scenes`;\n    }\n\n    async function load() {\n      try {\n        const response = await fetch(\"./status.json\", {cache: \"no-store\"});\n        if (!response.ok) throw new Error(`status ${response.status}`);\n        data = await response.json();\n        render();\n      } catch (error) {\n        $(\"main\").insertAdjacentHTML(\"afterbegin\", `\u003cdiv class=\"error\">Live update failed: ${esc(error.message)}\u003c/div>`);\n      }\n    }\n    addEventListener(\"keydown\", event => {\n      if (!data || ![\"ArrowLeft\", \"ArrowRight\"].includes(event.key) || /^(SELECT|INPUT|TEXTAREA|BUTTON|SUMMARY)$/.test(event.target.tagName) || event.target.isContentEditable) return;\n      const scenes = dataset().scenes;\n      let index = scenes.findIndex(scene => scene.case_id === selectedCase);\n      index = (index + (event.key === \"ArrowRight\" ? 1 : -1) + scenes.length) % scenes.length;\n      selectedCase = scenes[index]?.case_id || null;\n      deductionsOpen = false;\n      render();\n    });\n    load();\n  \u003c/script>\n\u003cscript src=\"./assets/public-board-navigation.js\">\u003c/script>\n\u003c/body>\u003c/html>\n"}</script><script>
(async()=>{
 const views=JSON.parse(document.getElementById('scene-views').textContent);
 const requested=new URLSearchParams(location.search).get('scope')||'open-space';
 const scope=Object.hasOwn(views,requested)?requested:'open-space';
 const parsed=new DOMParser().parseFromString(views[scope],'text/html');
 document.head.replaceChildren(...parsed.head.childNodes);
 document.body.replaceChildren(...parsed.body.childNodes);
 for(const attr of parsed.body.attributes)document.body.setAttribute(attr.name,attr.value);
 for(const previous of [...document.body.querySelectorAll('script')]){
  const script=document.createElement('script');
  for(const attr of previous.attributes)script.setAttribute(attr.name,attr.value);
  script.textContent=previous.textContent;
  const ready=script.src?new Promise((resolve,reject)=>{script.onload=resolve;script.onerror=reject}):null;
  previous.replaceWith(script);if(ready)await ready;
 }
})().catch(error=>{const p=document.createElement('p');p.textContent='SceneBoard could not load: '+error.message;document.body.appendChild(p)});
</script></body></html>
